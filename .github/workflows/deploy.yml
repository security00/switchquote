name: Deploy switchquote to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-switchquote
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'security00/switchquote'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check this is the switchquote worker
        run: bash scripts/check-worker-identity.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
      - name: Apply D1 migrations (switchquote)
        run: npx wrangler d1 migrations apply switchquote --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (switchquote)
        run: npx wrangler deploy --name switchquote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
