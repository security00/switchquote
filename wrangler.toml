name = "switchquote"
main = ".open-next/worker.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "faae494a756090f5f9c0ad7b8d1ddb88"
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "switchquote"

[[d1_databases]]
binding = "DB"
database_name = "switchquote"
database_id = "3cef716a-f944-410f-a3f6-f71f8fb662b2"
migrations_dir = "migrations"

[images]
binding = "IMAGES"

# Operator alert emails via Cloudflare Email Sending. crayonink.com is the onboarded sending
# domain on this account; workers.dev can't be onboarded, so alerts reuse that sender.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["alerts@crayonink.com"]

# Non-secret configuration. Secrets (DEEPGRAM_API_KEY, OPENROUTER_API_KEY, TURNSTILE_SECRET_KEY,
# AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET) are set with `wrangler secret put` — never here.
[vars]
# Debug phase: only these Google accounts may run paid inference. Empty or "*" = every signed-in account.
TRANSCRIBE_ALLOWLIST = "xiangqiling5204@gmail.com"
# One-time free minutes for a new allowed account (lifetime). Placeholder from the PRD draft (15); 掌柜 decides.
SIGNUP_FREE_MINUTES = "15"
MAX_FILE_MB = "50"
MAX_DURATION_MIN = "60"
# USD breakers per UTC day (STT + translation). Visitors never see these numbers.
USER_DAILY_SPEND_LIMIT_USD = "1"
DAILY_SPEND_LIMIT_USD = "3"
# Leave empty in production; preview versions set "preview" so they never trip the live breaker.
SPEND_NAMESPACE = ""
ALERT_EMAIL_TO = "support@crayonink.com"
ALERT_EMAIL_FROM = "alerts@crayonink.com"
# Turnstile widget "switchquote" (managed) for switchquote / preview-switchquote .potter-faa.workers.dev.
TURNSTILE_SITE_KEY = "0x4AAAAAAFNr2HeBiRCdfzdY"
# Transcription engine (lib/engines/registry.ts): deepgram | assemblyai | gemini | grok | elevenlabs.
# List prices live in each adapter. Users never choose; ADMIN_EMAILS may override per request (x-sq-engine).
STT_ENGINE = "deepgram"
ADMIN_EMAILS = "xiangqiling5204@gmail.com"
# Comma-separated engine ids to switch off even when their key is present.
ENGINES_DISABLED = ""
DEEPGRAM_MODEL = "nova-3"
ASSEMBLYAI_MODEL = "universal-3-5-pro"
# gemini: "openrouter" (paid, no training) or "google" (GOOGLE_API_KEY; free tier trains on content).
GEMINI_ROUTE = "openrouter"
GEMINI_MODEL = "gemini-3.8-flash"
# grok: "xai" (direct, diarization + word times; needs XAI_API_KEY — missing, so disabled) or "openrouter" (text only).
GROK_ROUTE = "xai"
GROK_MODEL = "grok-voice-transcribe-2.0"
# elevenlabs: needs ELEVENLABS_API_KEY (missing, so disabled).
ELEVENLABS_MODEL = "scribe_v2"
# Fallback switch detector for engines without per-word language: llm | heuristic | off.
LANG_TAGGER = "llm"
LANG_TAGGER_MODEL = "google/gemini-3.5-flash-lite"
TRANSLATE_MODEL = "google/gemini-3.8-flash"
DEPLOY_CHANNEL = ""
